spring.application.name=JobApplication
# Render's default port
server.port=${PORT:8081}

# ---- Database (MySQL, hosted outside Render because Render has no MySQL) ----
# CHANGE THIS: HOST, PORT and DBNAME come from your MySQL provider's dashboard
spring.datasource.url=jdbc:mysql://mysql-2c0475fd-akshaya09775-3073.j.aivencloud.com:19322/jobportal?ssl-mode=REQUIRED
# CHANGE THIS: the database user from your MySQL provider
spring.datasource.username=avnadmin
# only the password comes from an environment variable
spring.datasource.password=${db_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- JWT secret: random text, at least 32 characters (you may replace it with your own) ----
app.jwt.secret=BZfl5d5C6f9JDjHeY_maXMWEZmXopsdGRfdNUGQr6wFDpQFD8XXbSY_zqmDcVUSW
app.jwt.expiration-ms=86400000

# ---- CORS: CHANGE THIS to your frontend address on Render (no trailing slash) ----
app.cors.allowed-origins=https://jobportal-web.onrender.com,http://localhost:5173,http://127.0.0.1:5173, https://24eg105r48.netlify.app

# ---- Resume uploads ----
app.upload-dir=/data/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- Default admin (created on first start) ----
app.admin.email=admin@jobportal.com
# CHANGE THIS: choose your own strong admin password (10+ characters). The app will not start with "CHANGE_ME".
app.admin.password=CHANGE_ME

# ---- Public address of the web app (used for links inside emails): CHANGE THIS ----
app.name=CareerLink
app.base-url=https://jobportal-web.onrender.com

# ---- Email (SMTP). Host empty = emails are only logged ----
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=no-reply@localhost
app.mail.log-body-when-not-sent=false
app.password-reset.expiry-minutes=60

# ---- Rate limit for login / register / password-reset endpoints (per IP, per minute) ----
app.ratelimit.auth-per-minute=20

# ---- Health check ----
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# ---- Login brute-force protection ----
app.login.max-attempts=5
app.login.lock-minutes=15

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---- Job import ----
app.import.enabled=true
app.import.greenhouse=stripe:Stripe,airbnb:Airbnb,figma:Figma,discord:Discord,cloudflare:Cloudflare,databricks:Databricks,robinhood:Robinhood,coinbase:Coinbase
app.import.lever=spotify:Spotify,palantir:Palantir,cred:CRED,meesho:Meesho
app.import.max-per-company=25
app.import.cron=0 15 */6 * * *

# Adzuna switched off (empty id/key)
app.import.adzuna.app-id=
app.import.adzuna.app-key=
app.import.adzuna.countries=in,us
app.import.adzuna.categories=it-jobs,engineering-jobs,graduate-jobs
app.import.adzuna.pages=2

# The Muse (no key needed)
app.import.muse.enabled=true
app.import.muse.categories=Software Engineering,Data and Analytics,Computer and IT
app.import.muse.pages=2
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5